# mouse support
set -g mouse on

# start windows and panes at 1 not 0
set -g base-index 1
setw -g pane-base-index 1

# renumber windows when one is closed
set -g renumber-windows on

# bigger scrollback buffer
set -g history-limit 10000

# faster key response (fixes vim ESC delay)
set -s escape-time 0

# split panes with | and - (easier to remember)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# new windows open in current path
bind c new-window -c "#{pane_current_path}"
# bind previous windows
bind p last-window

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

#Stop renaming windows
set-option -g allow-rename off

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# better colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# status bar
set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241] %H:%M #[fg=colour233,bg=colour245] #h '
set -g status-right-length 50

#vi copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
